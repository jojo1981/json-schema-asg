name: PHP Build

on:
  push:
    branches: [ "main", "bugfix/*", "feature/*", "release/*" ]
  pull_request:
    branches: [ "main", "bugfix/*", "feature/*", "release/*" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:

          # PHP 8.1
          - php-version: "8.1"
            symfony-yaml-version: "^4.0"
          - php-version: "8.1"
            symfony-yaml-version: "^5.0"
          - php-version: "8.1"
            symfony-yaml-version: "^6.0"

          # PHP 8.2
          - php-version: "8.2"
            symfony-yaml-version: "^4.0"
          - php-version: "8.2"
            symfony-yaml-version: "^5.0"
          - php-version: "8.2"
            symfony-yaml-version: "^6.0"

          # PHP 8.3
          - php-version: "8.3"
            symfony-yaml-version: "^4.0"
          - php-version: "8.3"
            symfony-yaml-version: "^5.0"
          - php-version: "8.3"
            symfony-yaml-version: "^6.0"
          - php-version: "8.3"
            symfony-yaml-version: "^7.0"

          # PHP 8.4
          - php-version: "8.4"
            symfony-yaml-version: "^4.0"
          - php-version: "8.4"
            symfony-yaml-version: "^5.0"
          - php-version: "8.4"
            symfony-yaml-version: "^6.0"
          - php-version: "8.4"
            symfony-yaml-version: "^7.0"
          - php-version: "8.4"
            symfony-yaml-version: "^8.0"

          # PHP 8.5
          - php-version: "8.5"
            symfony-yaml-version: "^4.0"
          - php-version: "8.5"
            symfony-yaml-version: "^5.0"
          - php-version: "8.5"
            symfony-yaml-version: "^6.0"
          - php-version: "8.5"
            symfony-yaml-version: "^7.0"
          - php-version: "8.5"
            symfony-yaml-version: "^8.0"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: 'xdebug' # Set up the code coverage driver
          tools: 'composer:latest' # Setup popular tools

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-

      - name: Install dependencies
        run: |
          composer require symfony/yaml:${{ matrix.symfony-yaml-version }} --no-update
          composer install --prefer-dist --no-progress

      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -not -path './var/*' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

      - name: Code Quality (PHPStan)
        run: |
          composer global require phpstan/phpstan
          phpstan analyse src --level=5

      - name: Run test suite
        run: composer run-script test
